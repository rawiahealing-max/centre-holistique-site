<!DOCTYPE html>
<html lang="fr" dir="ltr" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <title>Centre Holistique | Raouia Gharbal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; background-color: #FBF9F5; }
        .hidden-content { display: none; }
        .visible-content { display: block; }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="bg-white p-4 flex justify-between items-center shadow-md">
        <div class="font-bold text-xl">Centre Holistique</div>
        <div class="flex gap-4">
            <a href="#home">Accueil</a>
            <div class="group relative">
                <button>Formations ▾</button>
                <div class="absolute bg-white shadow-lg p-4 hidden group-hover:block">
                    <a href="#formations" onclick="filterCourses('Initiation Reiki')">Initiation Reiki</a><br>
                    <a href="#formations" onclick="filterCourses('Autres Formations')">Autres Formations</a>
                </div>
            </div>
            <a href="#retreats">Retreats</a>
            <button id="adminBtn" class="hidden bg-yellow-500 px-3 py-1 rounded" onclick="openAdmin()">Admin</button>
            <button onclick="openModal('loginModal')">Login</button>
        </div>
    </nav>

    <main class="p-8">
        <section id="formations"><h2 class="text-3xl font-bold mb-6">Formations</h2><div id="coursesGrid" class="grid grid-cols-3 gap-6"></div></section>

        <section id="studentDashboard" class="hidden bg-white p-8 rounded-2xl shadow mt-10">
            <h2 class="text-2xl font-bold mb-6">Mes Formations</h2>
            <div id="purchasedCoursesGrid" class="grid grid-cols-2 gap-4"></div>
        </section>
    </main>

    <!-- Admin Panel -->
    <div id="adminPanel" class="fixed inset-0 bg-white hidden p-10 overflow-y-auto">
        <button onclick="closeAdmin()" class="mb-4 bg-red-500 text-white px-4 py-2">Fermer</button>
        <button onclick="openModal('addCourseModal')" class="mb-4 bg-green-500 text-white px-4 py-2">Nouveau Cours</button>
        <table class="w-full border-collapse border">
            <thead><tr><th>Titre</th><th>Catégorie</th><th>Actions</th></tr></thead>
            <tbody id="adminCoursesTable"></tbody>
        </table>
    </div>

    <!-- Modals (Login/Signup/Add/Edit) ... (Simplified for structure) -->
    <script>
        // CORE LOGIC
        let storage = { users: JSON.parse(localStorage.getItem('rawia_users')) || [], courses: JSON.parse(localStorage.getItem('rawia_courses')) || [], currentUser: JSON.parse(sessionStorage.getItem('rawia_logged_user')) || null };
        function saveDB() { localStorage.setItem('rawia_users', JSON.stringify(storage.users)); localStorage.setItem('rawia_courses', JSON.stringify(storage.courses)); }

        function renderCourses() {
            const grid = document.getElementById('coursesGrid');
            grid.innerHTML = '';
            storage.courses.forEach(c => {
                const isOwned = storage.currentUser && (storage.currentUser.role === 'admin' || storage.currentUser.purchased.includes(c.id));
                grid.innerHTML += `
                    <div class="border p-4 rounded-xl">
                        <h3 class="font-bold">${c.title}</h3>
                        <p>${c.desc}</p>
                        ${isOwned ? `
                            <div class="mt-4 bg-green-50 p-2">
                                ${c.video ? `<a href="${c.video}" target="_blank" class="block">📺 Voir Vidéo</a>` : ''}
                                ${c.pdf ? `<a href="${c.pdf}" download>📄 Télécharger PDF</a>` : ''}
                            </div>
                        ` : `<button onclick="buyCourse(${c.id}, '${c.title}')" class="bg-blue-500 text-white p-2 mt-4">Acheter (WhatsApp)</button>`}
                    </div>
                `;
            });
        }

        function handleSaveCourse(e) {
            e.preventDefault();
            const course = {
                id: Date.now(),
                title: document.getElementById('cTitle').value,
                price: document.getElementById('cPrice').value,
                category: document.getElementById('cCat').value,
                desc: document.getElementById('cDesc').value,
                video: document.getElementById('cVideoLink').value,
                pdf: '', audio: '', image: ''
            };
            // ... (handle file uploads to base64)
            storage.courses.push(course);
            saveDB();
            renderCourses();
            renderAdminPanel();
            alert("Cours ajouté!");
        }

        function handleUpdateCourse(e) {
            e.preventDefault();
            const id = parseInt(document.getElementById('eId').value);
            const c = storage.courses.find(x => x.id === id);
            c.title = document.getElementById('eTitle').value;
            c.price = document.getElementById('ePrice').value;
            c.category = document.getElementById('eCat').value;
            c.desc = document.getElementById('eDesc').value;
            saveDB();
            alert("Cours mis à jour!");
            renderCourses();
            renderAdminPanel();
        }

        function renderAdminPanel() {
            const tbody = document.getElementById('adminCoursesTable');
            tbody.innerHTML = '';
            storage.courses.forEach(c => {
                tbody.innerHTML += `<tr>
                    <td>${c.title}</td>
                    <td>${c.category}</td>
                    <td>
                        <button onclick="editCourse(${c.id})" class="bg-blue-500 text-white px-2 py-1">Modifier</button>
                        <button onclick="deleteCourse(${c.id})" class="bg-red-500 text-white px-2 py-1">Supprimer</button>
                    </td>
                </tr>`;
            });
        }

        function editCourse(id) {
            const c = storage.courses.find(x => x.id === id);
            document.getElementById('eId').value = c.id;
            document.getElementById('eTitle').value = c.title;
            document.getElementById('ePrice').value = c.price;
            document.getElementById('eCat').value = c.category;
            document.getElementById('eDesc').value = c.desc;
            document.getElementById('editCourseModal').classList.remove('hidden');
        }

        function deleteCourse(id) {
            storage.courses = storage.courses.filter(x => x.id !== id);
            saveDB(); renderAdminPanel(); renderCourses();
        }

        function buyCourse(id, title) {
            if(!storage.currentUser) return alert("Veuillez vous connecter!");
            const msg = `Bonjour, je veux acheter: ${title}. Email: ${storage.currentUser.email}`;
            window.open(`https://wa.me/21626660344?text=${encodeURIComponent(msg)}`, '_blank');
        }

        window.addEventListener('DOMContentLoaded', () => { renderCourses(); renderAdminPanel(); });
    </script>
</body>
</html>
